name: One-time retrospective empty commits
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retroactive-activity.yml'

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Create dated empty commits and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Andi Scarola"
          git config user.email "andiscarola17@gmail.com"
          for day in 2026-10-11 2026-10-15 2026-10-16; do
            GIT_AUTHOR_DATE="${day}T12:00:00-06:00" GIT_COMMITTER_DATE="${day}T12:00:00-06:00" git -c commit.gpgsign=false commit --allow-empty -m "chore: retrospective no-change commit for ${day}"
          done
          git rm -- .github/workflows/retroactive-activity.yml
          git -c commit.gpgsign=false commit -m "chore: remove one-time retrospective workflow"
          git push origin HEAD:main
